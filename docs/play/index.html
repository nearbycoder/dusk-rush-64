          y: mix(a.y, b.y, f),
          z: mix(a.z, b.z, f),

          const mag = Math.hypot(tx, tz) || 1;
          p.tx = tx / mag;
          p.tz = tz / mag;

      const atlasCache = new WeakMap();
      function atlasFor(r) {
        let map = atlasCache.get(r);
        if (map) return map;
        let minX = Infinity,
          minZ = Infinity,
          maxX = -Infinity,
          maxZ = -Infinity;
        function trace(nodes, closed) {
          const path = new Path2D();
          nodes.forEach((p, i) => {
            minX = Math.min(minX, p.x);
            maxX = Math.max(maxX, p.x);
            minZ = Math.min(minZ, p.z);
            maxZ = Math.max(maxZ, p.z);
            if (i === 0) path.moveTo(p.x, -p.z);
            else path.lineTo(p.x, -p.z);

          if (closed) path.closePath();
          return path;
        }
        const road = trace(r.samples, !r.open);
        const shortcuts = r.cuts.map((c) => trace(c.nodes, false));
        map = {
          road,
          shortcuts,
          width: maxX - minX,
          height: maxZ - minZ,
          cx: (maxX + minX) / 2,
          cz: (maxZ + minZ) / 2,
        };
        atlasCache.set(r, map);
        return map;

      function routeMap(r, x, y, w, h, col, thick = 2, positions = false) {
        const map = atlasFor(r);

        C.save();
        C.translate(x + w / 2 - k * map.cx, y + h / 2 + k * map.cz);
        C.scale(k, k);
        C.lineJoin = "round";
        C.lineWidth = thick / k;
        C.strokeStyle = col;
        C.stroke(map.road);
        C.setLineDash([2 / k, 2 / k]);
        C.strokeStyle = "#b5c798";
        C.lineWidth = Math.min(1.6, thick) / k;
        for (const cut of map.shortcuts) C.stroke(cut);
        C.setLineDash([]);
        const dot = (p, color, radius) => {
          C.fillStyle = color;
          C.beginPath();
          C.arc(p.x, -p.z, radius / k, 0, TAU);
          C.fill();
        };
        const start = r.at(0);

        C.translate(start.x, -start.z);
        C.rotate(start.ang);
        C.fillStyle = ink;
        C.fillRect(-3 / k, -1 / k, 6 / k, 2 / k);
        C.restore();
        if (positions) {
          for (let i = vehicles.length - 1; i >= 0; i--) {
            const v = vehicles[i],
              q = path(r, v.s, v.cut);
            const px = q.x + q.nx * v.x,
              pz = q.z + q.nz * v.x;
            if (v !== pl) dot({ x: px, z: pz }, "#ff967c", 2.6);

        focus = buttons.findIndex((b) => b.id === e.target.dataset.action);
      });
      accessMenu.addEventListener("focusout", () => {
        focus = -1;
      });
      accessMenu.addEventListener("input", (e) => {
        if (e.target.dataset.action === "scrub") {
          filmCursor = Number(e.target.value);
          filmPaused = true;
          drawUI();
        }
      });
      accessMenu.addEventListener("click", (e) => {
        const id = e.target.dataset.action;
        if (screen === "race" && id === "pause") pause();
        else buttons.find((b) => b.id === id)?.fn?.();
        drawUI();
      });
      function drawUI() {
        C.clearRect(0, 0, W, H);
        buttons = [];
        if (screen === "race") rainOverlay();
        if (
          modal === "photo" ||
          modal === "guide" ||
          screen === "replay" ||
          (touchDevice && (screen === "race" || winW <= 1024 || winH <= 700))
        ) {
          drawTouchSurface();
          syncAccess();
          return;
        }
        if (screen === "title") title();
        else if (screen === "setup") setup();
        else if (screen === "garage") garage();
        else if (screen === "tracks") trackSelect();
        else if (screen === "race") hud();
        else if (screen === "pause")
          overlay("Paused", rte.t[0].toUpperCase(), [
            ["RESUME", pause],
            ["SETTINGS", settings],
            ["RESTART", startRace],
            ["RACE SETUP", () => change("setup")],
            ["DRIVING GUIDE", openGuide],
            ["PHOTO MODE", openPhoto],
          ]);
        else if (results) finishUI();
        if (modal) {
          buttons = [];
          settingsUI();
        }
        if (transition > 0)
          rect(0, 0, W, H, "rgba(221,246,132," + transition * 1.5 + ")");
        syncAccess();
      }
      function activate() {
        if (modal && focus < 0) {
          if (modal === "photo") leavePhoto();
          else if (modal === "guide") closeGuide();
          else modal = "";
          return;
        }
        let b = buttons[focus];
        if (b) b.fn();
        else if (screen === "title") change("setup");
        else if (screen === "setup") startRace();
        else if (screen === "garage" || screen === "tracks") change("setup");
        else if (screen === "pause") pause();
        else if (screen === "results") startRace();
        else if (screen === "replay") change("results");
      }
      function keydown(e) {
        if (graphicsLost) return;
        lastController = "keys";
        if (e.code === "Tab") return;
        const onButton = accessMenu.contains(e.target);
        if (
          e.target?.dataset?.action === "scrub" &&
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Home", "End"].includes(e.code)
        )
          return;
        if (onButton && (e.code === "Space" || e.code === "Enter")) return;
        if (
          [
            "Space",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
          ].includes(e.code)
        )
          e.preventDefault();
        if (
          modal === "photo" &&
          !onButton &&
          ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Equal", "Minus"].includes(e.code)
        ) {
          if (e.code === "ArrowLeft" || e.code === "ArrowRight")
            photoYaw += (e.code === "ArrowRight" ? 1 : -1) * 0.09;
          if (e.code === "ArrowUp" || e.code === "ArrowDown")
            photoElevation = clamp(photoElevation + (e.code === "ArrowUp" ? 0.06 : -0.06), -0.04, 1.15);
          if (e.code === "Equal" || e.code === "Minus")
            photoDistance = clamp(photoDistance + (e.code === "Equal" ? -0.4 : 0.4), 2.9, 15);
          return;
        }
        keys.add(e.code);
        if (e.repeat) return;
        if (e.code === "Escape") {
          inputBack();
          return;
        }
        if (screen === "replay" && ["Space", "ArrowRight", "ArrowLeft"].includes(e.code)) {
          if (e.code === "Space") filmPaused = !filmPaused;
          else {
            filmPaused = true;
            filmCursor = clamp(
              filmCursor + (e.code === "ArrowRight" ? 0.5 : -0.5),
              0,
              (filmCount - 1) / replayHz,
            );
          }
          return;
        }
        if (screen === "race") {
          if (e.code === "KeyR") manual();
          if (e.code === "KeyC") cam = mod(cam + 1, 3);
          return;
        }
        if (
          screen === "garage" &&
          !modal &&
          ["KeyQ", "KeyE"].includes(e.code)
        ) {
          orbit += ((e.code === "KeyQ" ? -1 : 1) * Math.PI) / 8;
          orbitHold = clock + 3;
          return;
        }
        if (e.code === "Enter" || e.code === "Space") activate();
        else if (
          !modal &&
          (screen === "garage" || screen === "tracks") &&
          ["ArrowLeft", "ArrowRight"].includes(e.code)
        )
          cycle(e.code === "ArrowRight" ? 1 : -1);
        else if (
          ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Tab"].includes(
            e.code,
          )
        ) {
          focus = mod(
            focus + (["ArrowUp", "ArrowLeft"].includes(e.code) ? -1 : 1),
            buttons.length || 1,
          );
          if (onButton && buttons[focus]) {
            const next = Array.from(accessMenu.children).find(
              (item) => item.dataset.action === buttons[focus].id,
            );
            next?.focus({ preventScroll: true });
          }
        }
      }
      addEventListener("keydown", keydown);
      addEventListener("keyup", (e) => keys.delete(e.code));
      addEventListener("blur", () => {
        clearControls();
        if (screen === "race") pause();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          clearControls();
          if (screen === "race") pause();
        }
      });
      addEventListener("resize", resize);
      const cab = document.getElementById("cab");
      cab.addEventListener("contextmenu", (e) => e.preventDefault());
      cab.addEventListener("selectstart", (e) => e.preventDefault());
      function locate(e, previous) {
        const r = ui.getBoundingClientRect();
        const x = (e.clientX - r.left) / S,
          y = (e.clientY - r.top) / S;
        const inside = (b, extra) =>
          x >= b.x - extra && x <= b.x + b.w + extra && y >= b.y - extra && y <= b.y + b.h + extra;
        return (
          buttons.find((b) => inside(b, 0)) || buttons.find((b) => b.id === previous && inside(b, 8 / S))
        );
      }
      function scrubAt(e) {
        const b = buttons.find((b) => b.id === "scrub");
        if (!b) return;
        const x = (e.clientX - ui.getBoundingClientRect().left) / S;
        filmCursor = (clamp((x - b.x) / b.w, 0, 1) * (filmCount - 1)) / replayHz;
      }
      ui.onpointermove = (e) => {
        if (screen === "replay" && filmScrub === e.pointerId) {
          scrubAt(e);
          return;
        }
        if (photoDrag && e.pointerId === photoDrag.id) {
          photoYaw -= (e.clientX - photoDrag.x) * 0.009;
          photoElevation = clamp(photoElevation + (e.clientY - photoDrag.y) * 0.006, -0.04, 1.15);
          photoDrag.x = e.clientX;
          photoDrag.y = e.clientY;
          return;
        }
        if (orbitDrag && e.pointerId === orbitDrag.id) {
          orbit += (e.clientX - orbitDrag.x) * 0.012;
          orbitDrag.x = e.clientX;
          return;
        }
        if (touches.has(e.pointerId)) {
          const target = locate(e, touches.get(e.pointerId));
          touches.set(e.pointerId, drivePads.has(target?.id) ? target.id : "");
          return;
        }
        if (e.pointerType !== "touch") {
          const b = locate(e);
          hover = b?.id || "";
          ui.style.cursor = b ? "pointer" : "default";
        }
      };
      ui.onpointerdown = (e) => {
        lastController = e.pointerType === "touch" ? "touch" : "keys";
        if (e.button !== 0) return;
        e.preventDefault();
        if (!document.hasFocus()) window.focus();
        const b = locate(e);
        if (!b && modal === "photo") {
          photoDrag = { id: e.pointerId, x: e.clientX, y: e.clientY };
          ui.setPointerCapture(e.pointerId);
          return;
        }
        if (!b && screen === "garage" && !modal) {
          orbitDrag = { id: e.pointerId, x: e.clientX };
          ui.setPointerCapture(e.pointerId);
          return;
        }
        if (!b) return;
        ui.setPointerCapture(e.pointerId);
        focus = -1;
        if (screen === "replay" && b.id === "scrub") {
          filmScrub = e.pointerId;
          filmPaused = true;
          scrubAt(e);
          return;
        }
        if (screen === "race" && drivePads.has(b.id)) touches.set(e.pointerId, b.id);
        else pendingTaps.set(e.pointerId, b.id);
        drawUI();
      };
      function releasePointer(e) {
        if (photoDrag?.id === e.pointerId) photoDrag = null;
        if (filmScrub === e.pointerId) filmScrub = null;
        touches.delete(e.pointerId);
        pendingTaps.delete(e.pointerId);
        if (orbitDrag?.id === e.pointerId) {
          orbitDrag = null;
          orbitHold = clock + 3;
        }
      }
      ui.onpointerup = (e) => {
        const tap = pendingTaps.get(e.pointerId);
        releasePointer(e);
        if (tap) {
          const b = locate(e);
          if (b?.id === tap) {
            b.fn();
            save();
          }
        }
        drawUI();
      };
      ui.onpointercancel = ui.onlostpointercapture = releasePointer;
      let padButtons = [];
      function gamepad() {
        let p;
        try {
          p = Array.from(navigator.getGamepads?.() || []).find(Boolean);
        } catch {
          padState = {};
          return;
        }
        if (!p) {
          padState = {};
          return;
        }
        let b = p.buttons.map((v) => v.pressed),
          press = (i) => b[i] && !padButtons[i],
          ax = p.axes[0] || 0;
        if (b.some(Boolean) || Math.abs(ax) > 0.15) lastController = "pad";
        padState = {
          steer: Math.abs(ax) > 0.12 ? ax : 0,
          gas: p.buttons[7]?.value || +b[0],
          brake: p.buttons[6]?.value || +b[1],
          boost: b[4],
          hand: b[2],
        };
        if (press(9)) inputBack();
        else if (screen === "race") {
          if (press(3)) cam = mod(cam + 1, 3);
          if (press(8)) manual();
        } else {
          if (press(0)) activate();
          if (press(1)) inputBack();
          if (press(12) || press(13) || press(14) || press(15))
            focus = mod(
              focus + (press(12) || press(14) ? -1 : 1),
              buttons.length || 1,
            );
        }
        padButtons = b;
      }
      // A browser can reclaim a mobile tab's GPU while it is in the background.
      // Keep the interrupted lap in this history entry and rebuild GPU objects on reload.
      let graphicsLost = false;
      const resumeKey = "dusk-rush64-graphics-v1";
      function interruptedRun() {
        const active = ["race", "pause", "results", "replay"].includes(screen) && pl;
        const settings = {};
        for (const key of ["mode", "car", "track", "cup", "difficulty", "damage", "paint", "livery"])
          settings[key] = prefs[key];
        const snapshot = {
          at: Date.now(),
          screen: active ? (results ? "results" : "pause") : screen,
          settings,
        };
        if (!active) return snapshot;
        snapshot.run = {
          routeId,
          elapsed,
          countdown,
          score,
          cam,
          tick,
          runDamage,
          raceLog,
          results,
          ghostInterval,
          tape: ghostTape.length > 1 ? packGhost(ghostTape) : null,
          racers: vehicles.map((v) => {
            const { model, signature, tickHull, tickStart, lastTyres, ...fields } = v;
            return fields;
          }),
          removed: props.map((p) => !!p.dead),
        };
        return snapshot;
      }
      function restoreGraphicsRun() {
        let snapshot;
        try {
          snapshot = history.state?.[resumeKey];
          if (snapshot) {
            const state = { ...history.state };
            delete state[resumeKey];
            history.replaceState(state, "");
          }
        } catch {}
        try {
          const spare = sessionStorage.getItem(resumeKey);
          sessionStorage.removeItem(resumeKey);
          if (!snapshot && spare) snapshot = JSON.parse(spare);
        } catch {}
        if (!snapshot || !Number.isFinite(snapshot.at) || Date.now() - snapshot.at > 86400000) return;
        try {
          const settings = snapshot.settings;
          for (const [k, size] of Object.entries({
            mode: 5,
            car: 30,
            track: 20,
            cup: 5,
            difficulty: 3,
            damage: 3,
            paint: 8,
            livery: liveries.length,
          }))
            if (!Number.isInteger(settings[k]) || settings[k] < 0 || settings[k] >= size) return;
          const saved = snapshot.run;
          if (!saved) {
            if (["title", "setup", "tracks", "garage"].includes(snapshot.screen)) {
              Object.assign(prefs, settings);
              change(snapshot.screen);
            }
            return;
          }
          const r = routes[saved.routeId],
            count = [2, 4].includes(settings.mode) ? 1 : 8;
          if (
            !r ||
            !Array.isArray(saved.racers) ||
            saved.racers.length !== count ||
            !saved.racers.every(
              (v, i) =>
                v.slot === i &&
                cars[v.id] &&
                Array.isArray(v.damage) &&
                v.damage.length === 5 &&
                [v.s, v.x, v.speed, v.air, v.penalty, v.gate, v.lap, ...v.damage].every(
                  Number.isFinite,
                ),
            ) ||
            ![saved.elapsed, saved.tick, saved.countdown, saved.score].every(Number.isFinite) ||
            !Array.isArray(saved.raceLog?.splits) ||
            !Array.isArray(saved.raceLog.laps)
          )
            return;
          Object.assign(prefs, settings);
          startRace(saved.routeId);
          vehicles.forEach((v, i) => Object.assign(v, saved.racers[i]));
          props.forEach((p, i) => (p.dead = !!saved.removed?.[i]));
          elapsed = saved.elapsed;
          tick = saved.tick;
          countdown = saved.countdown;
          score = saved.score;
          cam = clamp(saved.cam, 0, 2);
          runDamage = clamp(saved.runDamage, 0, 2);
          raceLog = saved.raceLog;
          results = saved.results;
          ghostInterval = saved.ghostInterval || 6;
          if (runMode === 2 && saved.tape) ghostTape = readGhost(saved.tape, rte) || ghostTape;
          screen = results ? "results" : "pause";
          followCamera(0, true);
          quietMotors();
        } catch {
          change("setup");
        }
      }
      world.addEventListener("webglcontextlost", (event) => {
        event.preventDefault();
        graphicsLost = true;
        clearControls();
        quietMotors();
        const snapshot = interruptedRun();
        try {
          history.replaceState({ ...history.state, [resumeKey]: snapshot }, "");
        } catch {
          try {
            sessionStorage.setItem(resumeKey, JSON.stringify(snapshot));
          } catch {}
        }
        accessMenu.inert = true;
        const title = document.createElement("strong"),
          message = document.createElement("p"),
          retry = document.createElement("button");
        title.textContent = "Graphics paused";
        message.textContent =
          "The browser interrupted the graphics. The game will reopen when the display is ready.";
        retry.type = "button";
        retry.textContent = "Reload game";
        retry.onclick = () => location.reload();
        err.replaceChildren(title, message, retry);
      });
      world.addEventListener("webglcontextrestored", () => location.reload());
      let prev = 0,
        acc = 0,
        perf = 0,
        testMode = false;
      function frame(ms) {
        if (graphicsLost) return;
        let delta = Math.min(0.09, (ms - prev) / 1000 || 0);
        prev = ms;
        if (!testMode) {
          clock += delta;
          if (screen === "garage" && !modal && !prefs.reduced && !orbitDrag && clock > orbitHold)
            orbit += delta * 0.19;
          gamepad();
          transition = Math.max(0, transition - delta);
          if (slow > 0) slow = Math.max(0, slow - delta);
          acc += delta * (slow > 0 ? 0.42 : screen === "race" && pl.finish ? 4 : 1);
          while (acc >= dt) {
            step(dt);
            acc -= dt;
          }
          if (screen === "race" && delta > 0.041) perf++;
          else perf = Math.max(0, perf - 0.4);
          if (perf > 45 && quality > 0.7) {
            quality = 0.68;
            particleCap = 54;
            resize();
            perf = 0;
          }
          if (screen === "replay" && !filmPaused && filmScrub === null) {
            filmCursor += delta;
            if (filmCursor > filmCount / replayHz + 0.65) change("results");
          }
          renderWorld();
          if (screen === "race" || (screen === "results" && results && !results.filmSealed)) {
            recordFinishFrame();
            if (screen === "results") results.filmSealed = true;
          }
          drawUI();
          mixRaceAudio();
        }
        requestAnimationFrame(frame);
      }
      // Open a Free Race configuration shared by the course book and garage.
      const launchParams = new URLSearchParams(location.search);
      const selection = (key, size) => {
        const value = launchParams.get(key);
        return value !== null && /^\d+$/.test(value) && Number(value) < size
          ? Number(value) : null;
      };
      const launchCar = selection("car", cars.length);
      const launchTrack = selection("track", routes.length);
      if (launchCar !== null && launchTrack !== null) {
        prefs.mode = 0;
        prefs.car = launchCar;
        prefs.track = launchTrack;
        screen = "setup";
      } else if (launchParams.has("start")) {
        screen = "setup";
      }
      restoreGraphicsRun();
      resize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
