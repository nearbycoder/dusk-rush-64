        let l = 0,
          h = nodes.length - 1;

          const m = (l + h) >> 1;
          if (nodes[m].s <= distance) l = m;
          else h = m;

          x: mix(a.x, b.x, f),
          y: mix(a.y, b.y, f),
          z: mix(a.z, b.z, f),
          ang,
          designY:

          grade: (b.y - a.y) / (b.s - a.s || 1),
          nx: Math.cos(ang),
          nz: -Math.sin(ang),

          const prev = a || nodes[open ? 0 : last - 1],
            next = nodes[i + 1] || nodes[open ? last : 1];
          const before = Math.hypot(p.x - prev.x, p.z - prev.z) || 1,
            after = Math.hypot(next.x - p.x, next.z - p.z) || 1;

            tz = (p.z - prev.z) / before + (next.z - p.z) / after;
          const mag = Math.hypot(tx, tz) || 1;
          p.tx = tx / mag;
          p.tz = tz / mag;
        }
        return len;

        let pts =

          anchors.push(len);
          for (let j = 0; j < 40; j++) {

              b = P(i),
              c = P(i + 1),
              d = P(i + 2);

                (2 * v +
                  (-a[k] + c[k]) * u +
                  (2 * a[k] - 5 * v + 4 * c[k] - d[k]) * u * u +
                  (-a[k] + 3 * v - 3 * c[k] + d[k]) * u * u * u),
            );

              let q = samples.at(-1);
              len += Math.hypot(p[0] - q.x, p[2] - q.z);
            }
            samples.push({ x: p[0], y: p[1], z: p[2], s: len });

        }
        let end = P(count);
        len += Math.hypot(end[0] - samples.at(-1).x, end[2] - samples.at(-1).z);
        samples.push({ x: end[0], y: end[1], z: end[2], s: len });
        const bounded = (s) => (open ? clamp(s, 0, len) : mod(s, len));

        len = measureRoad(samples, open);

            B = at(b);

            a,
            b,
            A,

            ratio: Math.min(1, Math.hypot(A.x - B.x, A.z - B.z) / (b - a)),

          };

          for (let end of [c.A, c.B]) {
            end.x += end.nx * lane;
            end.z += end.nz * lane;

          // travelled distance so its width, speed and steering stay uniform.

            az = A.z + A.nx * handle,
            bx = B.x + B.nz * handle,
            bz = B.z - B.nx * handle;
          c.nodes = [];

            const f = j / 72,

                3 * v * v * f * ax +
                3 * v * f * f * bx +
                f * f * f * B.x,

                v * v * v * A.z +
                3 * v * v * f * az +
                3 * v * f * f * bz +
                f * f * f * B.z;

            [72, B],

      function keydown(e) {

          [
            "Space",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "Tab",
          ].includes(e.code)
        )
          e.preventDefault();
        keys.add(e.code);
        if (e.repeat) return;
        if (e.code === "Escape") {
          inputBack();
          return;
        }
        if (screen === "race") {
          if (e.code === "KeyR") manual();
          if (e.code === "KeyC") cam = mod(cam + 1, 3);
          return;
        }
        if (
          screen === "garage" &&
          !modal &&
          ["KeyQ", "KeyE"].includes(e.code)
        ) {
          orbit += ((e.code === "KeyQ" ? -1 : 1) * Math.PI) / 8;
          orbitHold = clock + 3;
          return;
        }
        if (e.code === "Enter" || e.code === "Space") activate();
        else if (
          !modal &&
          (screen === "garage" || screen === "tracks") &&
          ["ArrowLeft", "ArrowRight"].includes(e.code)
        )
          cycle(e.code === "ArrowRight" ? 1 : -1);
        else if (
          ["ArrowDown", "ArrowUp", "ArrowLeft", "ArrowRight", "Tab"].includes(
            e.code,
          )
        )
          focus = mod(
            focus + (["ArrowUp", "ArrowLeft"].includes(e.code) ? -1 : 1),
            buttons.length || 1,
          );
      }

          y = (e.clientY - r.top) / S;
        return buttons.find(
          (b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h,
        );
      }
      ui.onpointermove = (e) => {
        if (orbitDrag && e.pointerId === orbitDrag.id) {
          orbit += (e.clientX - orbitDrag.x) * 0.012;
          orbitDrag.x = e.clientX;
          return;
        }
        let b = locate(e);
        hover = b?.id || "";
        ui.style.cursor = b ? "pointer" : "default";
      };
      ui.onpointerdown = (e) => {
        let b = locate(e);
        if (
          !b &&
          screen === "garage" &&
          !modal &&
          (winW < winH && H >= 1100
            ? (e.clientY - ui.getBoundingClientRect().top) / S < H * 0.53
            : (e.clientX - ui.getBoundingClientRect().left) / S >
              Math.min(370, W * 0.44) + 68)
        ) {
          orbitDrag = { id: e.pointerId, x: e.clientX };
          ui.setPointerCapture(e.pointerId);
          return;
        }
        if (!b) return;
        ui.setPointerCapture(e.pointerId);
        focus = -1;
        if (screen === "race") {
          touches.set(e.pointerId, b.id);
          b.fn();
        } else {
          b.fn();
          save();
        }
        drawUI();
      };
      ui.onpointerup = ui.onpointercancel = (e) => {
        touches.delete(e.pointerId);
        if (orbitDrag?.id === e.pointerId) {
          orbitDrag = null;
          orbitHold = clock + 3;
        }
      };
      let padButtons = [];
      function gamepad() {
        let p = navigator.getGamepads?.()[0];
        if (!p) {
          padState = {};
          return;
        }
        let b = p.buttons.map((v) => v.pressed),
          press = (i) => b[i] && !padButtons[i],
          ax = p.axes[0] || 0;
        padState = {
          steer: Math.abs(ax) > 0.12 ? ax : 0,
          gas: p.buttons[7]?.value || +b[0],
          brake: p.buttons[6]?.value || +b[1],
          boost: b[4],
          hand: b[2],
        };
        if (press(9)) inputBack();
        else if (screen === "race") {
          if (press(3)) cam = mod(cam + 1, 3);
          if (press(8)) manual();
        } else {
          if (press(0)) activate();
          if (press(1)) inputBack();
          if (press(12) || press(13) || press(14) || press(15))
            focus = mod(
              focus + (press(12) || press(14) ? -1 : 1),
              buttons.length || 1,
            );
        }
        padButtons = b;
      }
      let prev = 0,
        acc = 0,
        perf = 0,
        testMode = false;
      function frame(ms) {
        let delta = Math.min(0.09, (ms - prev) / 1000 || 0);
        prev = ms;
        if (!testMode) {
          clock += delta;
          if (
            screen === "garage" &&
            !modal &&
            !prefs.reduced &&
            !orbitDrag &&
            clock > orbitHold
          )
            orbit += delta * 0.19;
          gamepad();
          transition = Math.max(0, transition - delta);
          if (slow > 0) slow = Math.max(0, slow - delta);
          acc += delta * (slow > 0 ? 0.42 : 1);
          while (acc >= dt) {
            step(dt);
            acc -= dt;
          }
          if (screen === "race" && delta > 0.041) perf++;
          else perf = Math.max(0, perf - 0.4);
          if (perf > 45 && quality > 0.7) {
            quality = 0.68;
            particleCap = 54;
            resize();
            perf = 0;
          }
          renderWorld();
          drawUI();
          if (audio && gain) {
            let on = screen === "race" && prefs.sound;
            gain.gain.setTargetAtTime(on ? 0.12 : 0, audio.currentTime, 0.04);
            if (on) {
              engine.type = [
                "sawtooth",
                "square",
                "sawtooth",
                "triangle",
                "square",
              ][Math.floor(pl.id / 6)];
              engine.frequency.setTargetAtTime(
                (35 + (Math.abs(pl.speed) * 5) / pl.gear + pl.gear * 2) *
                  [1.15, 0.79, 1.49, 1.05, 0.71][Math.floor(pl.id / 6)],
                audio.currentTime,
                0.035,
              );
              if (tick % 16 === 0 && pl.boosting)
                sfx(520, 0.08, "sawtooth", 0.035, 820);
              if (Math.abs(pl.drift) > 0.2 && tick % 12 === 0)
                sfx(950, 0.08, "triangle", 0.11, 740);
            }
          }
        }
        requestAnimationFrame(frame);
      }
      // Open a Free Race configuration shared by the course book and garage.
      const launchParams = new URLSearchParams(location.search);
      const selection = (key, size) => {
        const value = launchParams.get(key);
        return value !== null && /^\d+$/.test(value) && Number(value) < size
          ? Number(value) : null;
      };
      const launchCar = selection("car", cars.length);
      const launchTrack = selection("track", routes.length);
      if (launchCar !== null && launchTrack !== null) {
        prefs.mode = 0;
        prefs.car = launchCar;
        prefs.track = launchTrack;
        screen = "setup";
      } else if (launchParams.has("start")) {
        screen = "setup";
      }
      resize();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
